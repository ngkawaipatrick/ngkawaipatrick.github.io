<script>
QUESTIONS.push(
  { w: 1, q: `A competent adult hears the facts, refuses the recommended treatment, and the team respects that decision. Which principle is being honoured?`,
    o: [`Beneficence`, `Justice`, `Autonomy`, `Nonmaleficence`], a: 2,
    e: `Respecting a person's own decision is **autonomy**, the right to make one's own decisions, which the slides also call the principle of **human dignity**. Beneficence is doing good, nonmaleficence is avoiding harm, and justice is fairness in distributing benefits and risk. {W1 p16-17}` },
  { w: 1, q: `How do the four principles rank against each other, according to the slides?`,
    o: [`Autonomy always comes first`, `Nonmaleficence always comes first`, `Justice comes first when resources are scarce`, `No principle outweighs another`], a: 3,
    e: `The slides state that **no principle outweighs another**. That is why **different providers may reach different conclusions** on the same case, and why the principles frequently conflict. {W1 p16, p29}` },
  { w: 1, q: `A patient with delirium is clinically judged unable to decide today, but may recover. Which term fits?`,
    o: [`Incompetence`, `Incapacity`, `Paternalism`, `Double effect`], a: 1,
    e: `**Incapacity** is **clinically determined** and may be **transient**, as in delirium or psychosis. **Incompetence** is a legal finding, often permanent as in dementia, and the court assigns a surrogate. {W1 p18}` },
  { w: 1, q: `A hospice patient is given high-dose analgesics to relieve pain, although an unintended harm may follow. Which idea makes this acceptable?`,
    o: [`Double effect`, `Veil of ignorance`, `Difference principle`, `Pure procedural justice`], a: 0,
    e: `Under **double effect**, an **unintended consequence** is acceptable when the intended one is legitimate and the harm is **proportionately smaller** than the benefit. High-dose analgesics for a hospice patient is one of the slide's own examples. {W1 p26}` },
  { w: 1, q: `In an emergency department, a patient with a myocardial infarction is seen before a patient with an ankle sprain. What does this illustrate?`,
    o: [`Equal allocation: everyone gets the same`, `Distributive justice: fair, not necessarily equal`, `Autonomy: the patient chooses the order`, `Double effect: a harm that was not intended`], a: 1,
    e: `This is **triage**, the slide's example of **distributive justice**. Resources are allocated in a way that is **fair, not necessarily equal**, so the sicker patient goes first. {W1 p28}` },
  { w: 1, q: `Under Rawls's difference principle, inequalities are justified only if they:`,
    o: [`benefit the majority of society`, `are approved by a court`, `reward those who earn the most`, `give the greatest benefit to the least advantaged`], a: 3,
    e: `The **difference principle** accepts an inequality only when it gives the **greatest benefit to the least advantaged**. The slides' Hong Kong example is tax from higher earners subsidising the severely ill and poor. {W1 p31-34}` },
  { w: 1, q: `In Rawls's cake-cutting example, what makes the division fair?`,
    o: [`A judge divides the cake`, `The hungriest person gets the biggest slice`, `The person who cuts takes the last slice`, `Everyone votes on the slices`], a: 2,
    e: `The **cutter takes the last slice**, so the cutter has every reason to cut evenly. The slides use this to show **pure procedural justice**: the fairness comes from the procedure itself. {W1 p31-34}` },
  { w: 1, q: `Which of these is NOT one of the three conditions of a dilemma?`,
    o: [`The agent must decide`, `There are different courses of action`, `One of the options is fully acceptable`, `Some moral principle is always compromised`], a: 2,
    e: `A **dilemma** is a forced choice between conflicting options, **none acceptable**. Its three conditions are that the agent **must decide**, that there are **different courses of action**, and that **some moral principle is always compromised**. {W1 p36-41}` },
  { w: 1, q: `"I give you facts and help you to find your preferences." Which physician-patient model is this?`,
    o: [`Paternalistic`, `Informative`, `Deliberative`, `Interpretative`], a: 3,
    e: `That quote is the **interpretative** model. The others are **paternalistic** ("I decide for you"), **informative** ("I give you facts") and **deliberative** ("In addition, I tell you my preferences"). {W1 p49}` },
  { w: 1, q: `F, aged 17 years 5 months, had a spleen laceration with internal bleeding and refused a blood transfusion. What did the court do?`,
    o: [`Granted the declaration: preservation of life took precedence`, `Refused it, because 16-17-year-olds can consent to treatment`, `Left the decision to the parents`, `Ruled that Gillick made the refusal final`], a: 0,
    e: `The court **granted the declaration** for F, as it did for E, on the basis of **best interests**: "the preservation of life should take precedence". The Family Law Reform Act 1969 and Gillick appear on the slides as **counter-arguments**, not as the outcome. {W1 p22-23}` },

  { w: 2, q: `Which statement matches the slides' meaning of privacy?`,
    o: [`Rules or a promise restricting access to information`, `A person's ability to control access to themselves and their information`, `Permanent removal of identifiers from data`, `Logging and auditing every access to a record`], a: 1,
    e: `**Privacy** is a person's ability to **control access** to themselves and their information. **Confidentiality** is the rules or promise that **restrict access** to information, which is disclosed only by permission, rules or law. {W2 p26, p29}` },
  { w: 2, q: `Which of these is NOT one of the three reasons for confidentiality?`,
    o: [`A secure environment for the patient`, `Respect for autonomy`, `Public trust`, `Lower cost of care`], a: 3,
    e: `The slides give three reasons: a **secure environment** for the patient, respect for **autonomy**, and **public trust**. Cost is not among them. {W2 p31}` },
  { w: 2, q: `Which of these is NOT part of the Cap. 486 definition of personal data?`,
    o: [`It must be stored in the eHealth system`, `It relates to a living individual`, `The person's identity can practicably be ascertained from it`, `It is in a form where access or processing is practicable`], a: 0,
    e: `Personal data relates to a **living individual**, lets the identity be **practicably ascertained**, and is in a form where **access or processing is practicable**. Where it is stored is not part of the definition; photos or video of an identifiable person count too. {W2 p34}` },
  { w: 2, q: `A clinic's registration form collects far more personal details than it needs for care. Which data protection principle is most directly at issue?`,
    o: [`Security`, `Openness`, `Collection purpose and means`, `Data access and correction`], a: 2,
    e: `The **collection purpose and means** principle requires collection to be **lawful, fair and not excessive**. Collecting more than the purpose needs is excessive collection. {W2 p37}` },
  { w: 2, q: `Research data are coded, and the key holder can decode them to find the person. What is this called?`,
    o: [`Anonymisation`, `Pseudonymisation`, `Role-based access control`, `Openness`], a: 1,
    e: `**Pseudonymisation** means the data are **coded** and the **key holder can decode** them. In **anonymisation** the identifiers are **permanently and irrevocably removed**. {W2 p40}` },
  { w: 2, q: `Under HK Medical Council code 1.4.2, when may a doctor disclose medical information without the patient's consent?`,
    o: [`Whenever a family member asks`, `Whenever the patient's employer asks`, `Whenever the doctor thinks it would help`, `When there is a risk of death or serious harm, or when the law requires it`], a: 3,
    e: `Code 1.4.1 sets the rule: **obtain consent** before disclosing to a third party. Code 1.4.2 gives two exceptions: a risk of **death or serious harm** to the patient or someone else, and disclosure **required by law**. {W2 p50}` },
  { w: 2, q: `Under code 4.3.3, what must a doctor infected with a notifiable disease do?`,
    o: [`Inform the Department of Health`, `Tell every patient personally`, `Stop practising permanently`, `Publish the diagnosis in the clinic`], a: 0,
    e: `An infected doctor is **generally not required to tell patients**, but must inform the **Department of Health** if the disease is **notifiable**. A breach of the doctor's confidentiality may be warranted if the doctor ignores restrictions and puts others at risk. {W2 p55}` },
  { w: 2, q: `In eHealth, which principle limits what a healthcare provider may see in a record?`,
    o: [`Greatest Happiness Principle`, `Doctrine of the Mean`, `Need-to-know`, `Difference principle`], a: 2,
    e: `eHealth uses **role-based access control** and the "**need-to-know**" principle, and all access is **logged and audited**. The system is voluntary, encrypted and shares records two ways between public and private providers. {W2 p46-48}` },
  { w: 2, q: `Kant, duty and the Categorical Imperative belong to which theory?`,
    o: [`Utilitarianism`, `Deontology`, `Virtue ethics`, `Pragmatism`], a: 1,
    e: `**Deontology** comes from **deon**, duty, and is tied to **Kant** and the **Categorical Imperative**: treat people as an "end", not just a "means". Utilitarianism belongs to Bentham and Mill, and virtue ethics to Plato and Aristotle. {W2 p61}` },
  { w: 2, q: `Which statement matches Pragmatism as the slides present it?`,
    o: [`Follow duty whatever the consequences`, `Seek the greatest happiness for the greatest number`, `Find the mean between deficiency and excess`, `Decide according to experiences and scientific facts`], a: 3,
    e: `**Pragmatism** holds that neither Idealism nor Materialism is correct, so we decide according to **experiences and scientific facts**, and morality **progresses with the advancement of science**. The slide examples are flexible parenting and a buffer period for carbon neutrality. {W2 p74-75}` }
);
</script>
<script>
QUESTIONS.push(
  { w: 3, q: `In the Tuskegee study, what happened after penicillin became the standard treatment in 1947?`,
    o: [`The men were treated at once`, `The men still received no treatment`, `The study ended within six months`, `The men were asked for fresh consent`], a: 1,
    e: `The men were given **no treatment even after penicillin** became standard in 1947. The study of **untreated syphilis** was planned for 6 months and ran for **40 years** (1932-1972), and it led to the **Belmont Report** of 1979. {W3 p24}` },
  { w: 3, q: `Which of these is one of the ten points of the Nuremberg Code?`,
    o: [`A participant has the right to withdraw`, `A licence is needed for each experiment`, `Every access to a record is logged and audited`, `Entries are dated, signed and chopped`], a: 0,
    e: `The **Nuremberg Code** includes **voluntary consent** and the **right to withdraw**, and it requires the experiment to stop if it becomes dangerous. The other options come from the animal experiments ordinance, eHealth and medical records. {W3 p30}` },
  { w: 3, q: `What are the three principles of the Belmont Report?`,
    o: [`Replacement, reduction, refinement`, `Disclosure, understanding, authorization`, `Respect for persons, beneficence, justice`, `Wisdom, courage, moderation`], a: 2,
    e: `The **Belmont Report** names **respect for persons, beneficence and justice**. Replacement, reduction and refinement are the 3R of animal research, and disclosure, understanding and authorization belong to the consent review. {W3 p31}` },
  { w: 3, q: `Which body adopted the Declaration of Helsinki, and when?`,
    o: [`The U.S. Public Health Service, in 1932`, `The court at Nuremberg, in 1945`, `The Hospital Authority, in 1979`, `The WMA, in June 1964`], a: 3,
    e: `The **Declaration of Helsinki** belongs to the **WMA** and was adopted in **June 1964**. The slides give its latest amendment as October 2024. {W3 p32-33}` },
  { w: 3, q: `A research team recruits only from one care home because the residents are easy to reach. Which of the seven principles is most at risk?`,
    o: [`Valuable scientific question`, `Fair subject selection`, `Independent review`, `Valid methodology`], a: 1,
    e: `**Fair subject selection** means choosing subjects by **scientific objectives**, not by privilege, **easy availability** or vulnerability. Recruiting people only because they are convenient breaks that principle. {W3 p35, p38}` },
  { w: 3, q: `Which statement is true of a retrospective cohort study?`,
    o: [`Its data are available immediately, but it relies on memory and record quality`, `It is the more commonly used design, and cost is its main concern`, `It is intended to benefit each individual participant`, `It needs a licence for each experiment`], a: 0,
    e: `A **retrospective** cohort study has its **data available immediately** but **relies on memory and record quality**. The **prospective** design is the more commonly used one, and its concern is cost. {W3 p20}` },
  { w: 3, q: `What do the 3R of animal research stand for?`,
    o: [`Review, Risk, Respect`, `Recruitment, Randomisation, Reporting`, `Replacement, Reduction, Refinement`, `Rights, Responsibilities, Records`], a: 2,
    e: `The **3R** are **Replacement, Reduction and Refinement**. They sit beside the animal experiments ordinance on the slides about animal welfare. {W3 p54}` },
  { w: 3, q: `Which animals does the Animals (Control of Experiments) Ordinance (Cap. 340) cover?`,
    o: [`All animals, living or dead`, `Mammals only`, `Only animals bred for research`, `Living vertebrate animals`], a: 3,
    e: `Cap. 340 covers **living vertebrate animals** in experiments "**calculated to give pain**". A **licence is needed per experiment**, and the authority is the Department of Health. {W3 p55}` },
  { w: 3, q: `What conflict of interest do the slides point to in the Jesse Gelsinger case?`,
    o: [`The hospital owned the journal that published the trial`, `The principal investigator was also a consultant for the company`, `The participant was related to the investigator`, `The review body was paid by the participant's family`], a: 1,
    e: `In the Gelsinger gene therapy trial, the **principal investigator was also a consultant for the company**. Jesse Gelsinger had OTC deficiency and received the **highest dose**; gene therapy trials were suspended afterwards. {W3 p63-64}` },
  { w: 3, q: `Which pairing of researcher and misconduct is correct?`,
    o: [`Hwang Woo-Suk: fabricated data in stem cell papers. He Jiankui: gene-edited babies`, `Hwang Woo-Suk: gene-edited babies. He Jiankui: fabricated data in stem cell papers`, `Hwang Woo-Suk: untreated syphilis study. He Jiankui: cloned dog`, `Hwang Woo-Suk: highest-dose gene therapy. He Jiankui: thalidomide`], a: 0,
    e: `**Hwang Woo-Suk** had two Science papers on human SCNT stem cells retracted for **fabricated data**. **He Jiankui** is the researcher behind the **gene-edited babies** Lulu and Nana in 2018. {W3 p67-73}` }
);
</script>

<script>
defineView('Sample questions', (el) => {
  const L = ['A', 'B', 'C', 'D'];
  const note = cardEl({ cls: 'is-info', p: [`Practice questions written from the Week 1–3 slides. They are not official or past-paper questions.`, `Tap an option to check it, or use Show answer. Each question reveals only its own answer.`] }, 'questions-note');
  el.appendChild(note);

  const tools = document.createElement('div');
  tools.id = 'q-tools';
  const filters = [['all', 'All'], ['1', 'Week 1'], ['2', 'Week 2'], ['3', 'Week 3']];
  tools.innerHTML = filters.map((f) => '<button type="button" class="fchip" data-filter="' + f[0] + '" aria-pressed="' + (f[0] === 'all') + '">' + f[1] + '</button>').join('') +
    '<button type="button" class="btn" id="q-reset">Reset questions</button>';
  el.appendChild(tools);

  const list = document.createElement('div');
  list.id = 'q-list';
  list.className = 'grid';
  el.appendChild(list);

  const reveal = (card, item, picked) => {
    if (card.dataset.done === '1') return;
    card.dataset.done = '1';
    const opts = card.querySelectorAll('.opt');
    opts[item.a].classList.add('right');
    const res = card.querySelector('.q-result');
    if (picked === null) { res.textContent = 'Answer: ' + L[item.a]; res.className = 'q-result'; }
    else if (picked === item.a) { res.textContent = 'Correct'; res.className = 'q-result ok'; }
    else { opts[picked].classList.add('wrong'); res.textContent = 'Not quite. The answer is ' + L[item.a] + '.'; res.className = 'q-result no'; }
    card.querySelector('.q-show').hidden = true;
    card.querySelector('.q-exp').hidden = false;
    applySearch();
  };

  QUESTIONS.forEach((item, i) => {
    const n = i + 1;
    const card = document.createElement('article');
    card.className = 'card q-card';
    card.id = 'question-' + n;
    card.dataset.w = String(item.w);
    card.innerHTML =
      '<div class="q-front" id="question-' + n + '-front"><p class="q-stem"><span class="q-num">Q' + n + '</span>' + fmt(item.q) + ' <span class="chip">Week ' + item.w + '</span></p>' +
      '<div class="opts" id="question-' + n + '-options">' + item.o.map((o, k) => '<button type="button" class="opt" data-k="' + k + '"><b>' + L[k] + '</b><span>' + fmt(o) + '</span></button>').join('') + '</div></div>' +
      '<div class="q-actions" id="question-' + n + '-actions"><button type="button" class="btn q-show">Show answer</button><span class="q-result"></span></div>' +
      '<p class="q-hint" hidden>Match is in the answer: reveal to see it</p>' +
      '<div class="q-exp" id="question-' + n + '-answer" hidden><p>' + fmt(item.e) + '</p></div>';
    card.querySelectorAll('.opt').forEach((b) => { b.addEventListener('click', () => reveal(card, item, Number(b.dataset.k))); });
    card.querySelector('.q-show').addEventListener('click', () => reveal(card, item, null));
    list.appendChild(card);
  });

  tools.querySelectorAll('.fchip').forEach((chip) => {
    chip.addEventListener('click', () => {
      const f = chip.dataset.filter;
      tools.querySelectorAll('.fchip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      list.querySelectorAll('.q-card').forEach((c) => { c.dataset.f = (f === 'all' || c.dataset.w === f) ? '' : '1'; });
      applySearch();
    });
  });

  tools.querySelector('#q-reset').addEventListener('click', () => {
    list.querySelectorAll('.q-card').forEach((c) => {
      c.dataset.done = '';
      c.querySelectorAll('.opt').forEach((o) => o.classList.remove('right', 'wrong'));
      const res = c.querySelector('.q-result');
      res.textContent = '';
      res.className = 'q-result';
      c.querySelector('.q-show').hidden = false;
      c.querySelector('.q-exp').hidden = true;
    });
    applySearch();
  });
});
</script>
<script>
DEBATE.push(
  { t: `Before you prepare`, cls: 'is-info', p: [
    `The slides do not describe the lifeboat debate. The scenario and roles are unknown until the night.`,
    `So the cards below are general: each one is a way of arguing that works from **any role**. Pick the two or three that suit the role you are given.`
  ] },
  { t: `[out] Background: lifeboat ethics`, cls: 'is-out', p: [
    `Lifeboat ethics is a metaphor for resource distribution proposed by the ecologist Garrett Hardin in 1974: a lifeboat with 50 people aboard and room for 10 more, surrounded by 100 swimmers.`,
    `Source: [[https://en.wikipedia.org/wiki/Lifeboat_ethics]]`,
    `The class scenario may differ.`
  ] },
  { t: `Utilitarian lens {W2 p61}`, items: [
    `**Idea**: judge by **consequences**; choose what saves the most lives or brings the most benefit (**Greatest Happiness Principle**).`,
    `**Starter**: "Our choice should bring the greatest benefit to the greatest number, so..."`,
    `**Weakness to expect**: it may **sacrifice the few for the many**. Be ready to say why that is still defensible here.`
  ] },
  { t: `Deontology lens {W2 p61, p66}`, items: [
    `**Idea**: act from **duty**; nobody is merely a **means**; everyone is owed **equal respect**.`,
    `**Starter**: "Whatever the outcome, we have a duty not to use any person as a means, so..."`,
    `**Weakness to expect**: **rigid** and insensitive to consequences. Be ready for "but then more people are lost".`
  ] },
  { t: `Virtue lens {W2 p62-64}`, items: [
    `**Idea**: ask what a person of **practical wisdom** would do; aim for **courage**, the mean between cowardice and recklessness.`,
    `**Starter**: "A person of good character in my role would..., because that is courage and not recklessness."`,
    `**Weakness to expect**: it lacks clear action-guiding rules and may be culturally relative.`
  ] },
  { t: `Justice and triage lens {W1 p28}`, items: [
    `**Idea**: **distributive justice** is **fair, not necessarily equal**. Triage puts the myocardial infarction before the ankle sprain.`,
    `**Starter**: "Fair does not mean equal. The criterion we should use is..., because..."`,
    `**Weakness to expect**: the group may reject your criterion. State it openly and defend it.`
  ] },
  { t: `Rawls lens {W1 p31-34}`, items: [
    `**Idea**: behind the **veil of ignorance**, pick the rule you would accept without knowing your own seat; protect the **least advantaged**.`,
    `**Starter**: "If none of us knew which role we would get, the rule we would all accept is..."`,
    `**Tool**: the **cake-cutting** procedure. Whoever proposes the rule takes the last pick.`
  ] },
  { t: `Four principles lens {W1 p16, p29}`, items: [
    `**Idea**: name which of **autonomy, beneficence, nonmaleficence and justice** are in conflict in the scenario.`,
    `**Starter**: "This is a conflict between ... and ...; no principle outweighs another, so we must justify the choice."`,
    `**Weakness to expect**: the principles do not rank themselves, so another member can reach a different conclusion from the same four.`
  ] },
  { t: `Pragmatism lens {W2 p74-75}`, items: [
    `**Idea**: decide from **experiences and scientific facts**; accept a flexible, staged compromise, like the **buffer period** in the carbon neutrality example.`,
    `**Starter**: "Given the facts we actually have, a workable step is..., and we adjust it as things change."`,
    `**Why it matters**: part (b) of the group report assesses your contribution in terms of Pragmatism. Note where you changed position.`
  ] },
  { t: `Trolley problem as a comparison {W1 p36-41}`, items: [
    `**Trolley 1**: pull the lever; 5 saved and 1 dies. **Trolley 2**: push the heavy man off the bridge.`,
    `**Use**: ask the group whether the proposed choice is more like pulling the lever or more like pushing the man, and why that difference matters to them.`,
    `It links straight to the utilitarian and deontology lenses above.`
  ] },
  { t: `Closing tip`, cls: 'is-info', items: [
    `A **dilemma always compromises some moral principle**, so admit what your position gives up. {W1 p41}`,
    `**No single theory** solves all ethical problems; combining two lenses is a strength, not a contradiction. {W3 p10}`
  ] }
);
</script>
