<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搶答計分板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,"PingFang HK","Helvetica Neue",Arial,sans-serif; background:#020617; color:#fff; overflow:hidden; }

  /* ---------- SINGLE HOUSE VIEW ---------- */
  #single { display:none; height:100vh; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; }
  body.single #single { display:flex; }
  #single.ruby     { background:linear-gradient(135deg,#dc2626,#7f1d1d); }
  #single.topaz    { background:linear-gradient(135deg,#f59e0b,#b45309); }
  #single.sapphire { background:linear-gradient(135deg,#2563eb,#1e3a8a); }
  #single.emerald  { background:linear-gradient(135deg,#059669,#064e3b); }
  #single .sName { font-size:clamp(40px,9vw,90px); font-weight:900; letter-spacing:1px; }
  #single .sZh { font-size:clamp(20px,4vw,36px); font-weight:800; opacity:.85; margin-top:4px; }
  #single .sScore { font-size:clamp(140px,42vw,420px); font-weight:900; line-height:.9; margin-top:10px; font-variant-numeric:tabular-nums; }
  #single .sScore.bump { animation:bump .35s ease; }
  #single .sCrown { font-size:clamp(40px,10vw,90px); margin-top:8px; height:1.1em; }
  @keyframes bump { 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

  /* ---------- HOST / ALL VIEW ---------- */
  #hostView { min-height:100vh; display:flex; flex-direction:column; padding:16px; }
  body.single #hostView { display:none; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .title { font-size:clamp(20px,4vw,34px); font-weight:900; display:flex; align-items:center; gap:8px; }
  .status { font-size:12px; padding:4px 10px; border-radius:999px; background:#1e293b; cursor:pointer; }
  .status.on { background:#059669; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin-bottom:14px; }
  .toolbar span { font-size:13px; color:#94a3b8; }
  .chip { padding:8px 16px; border-radius:10px; background:#1e293b; color:#fff; font-weight:800; border:none; font-size:14px; cursor:pointer; }
  .chip.active { background:#fff; color:#0f172a; }
  .chip.reset { background:#334155; }
  .chip.reset:active { background:#dc2626; }
  #customAmt { width:70px; padding:8px; border-radius:10px; background:#1e293b; color:#fff; text-align:center; font-weight:800; border:none; font-size:14px; }
  .grid { flex:1; display:grid; grid-template-columns:1fr; gap:12px; }
  @media(min-width:640px){ .grid{ grid-template-columns:1fr 1fr; gap:18px; } }
  .card { position:relative; border-radius:26px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,.4); }
  .ruby     { background:linear-gradient(135deg,#dc2626,#7f1d1d); }
  .topaz    { background:linear-gradient(135deg,#f59e0b,#b45309); }
  .sapphire { background:linear-gradient(135deg,#2563eb,#1e3a8a); }
  .emerald  { background:linear-gradient(135deg,#059669,#064e3b); }
  .cname { font-size:clamp(22px,4vw,32px); font-weight:900; }
  .czh { font-size:14px; opacity:.8; font-weight:700; }
  .crown { position:absolute; top:16px; right:16px; font-size:26px; display:none; }
  .card.lead .crown { display:block; }
  .score { font-size:clamp(56px,14vw,110px); font-weight:900; text-align:center; line-height:1; padding:10px 0; font-variant-numeric:tabular-nums; }
  .score.bump { animation:bump .35s ease; }
  .btns { display:flex; gap:10px; }
  .btn { flex:1; padding:14px; border-radius:14px; border:none; color:#fff; font-weight:900; font-size:18px; cursor:pointer; background:rgba(255,255,255,.22); }
  .btn:active { transform:scale(.94); }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.show { display:flex; }
  .box { background:#1e293b; border-radius:20px; padding:26px; width:100%; max-width:300px; text-align:center; }
  .box h2 { font-size:18px; margin-bottom:4px; }
  .box p { font-size:12px; color:#94a3b8; margin-bottom:16px; }
  .box input { width:100%; padding:14px; border-radius:10px; background:#0f172a; color:#fff; text-align:center; font-size:22px; letter-spacing:6px; border:2px solid transparent; outline:none; }
  .box input.err { border-color:#ef4444; }
  .box button { width:100%; margin-top:14px; padding:14px; border-radius:10px; background:#059669; color:#fff; font-weight:800; border:none; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<div id="single">
  <div class="sName" id="sName"></div>
  <div class="sZh" id="sZh"></div>
  <div class="sScore" id="sScore">0</div>
  <div class="sCrown" id="sCrown"></div>
</div>

<div id="hostView">
  <div class="header">
    <div class="title">🏆 搶答計分板</div>
    <div id="modeBtn" class="status" onclick="toggleMode()">顯示模式</div>
  </div>
  <div class="toolbar" id="toolbar">
    <span>每次加減：</span>
    <button class="chip amt" data-v="1">1</button>
    <button class="chip amt" data-v="5">5</button>
    <button class="chip amt active" data-v="10">10</button>
    <button class="chip amt" data-v="20">20</button>
    <input id="customAmt" type="number" placeholder="其他">
    <button class="chip reset" onclick="resetAll()">↺ 清零</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>主持登入</h2>
    <p>輸入密碼開啟改分功能</p>
    <input id="pw" type="password" placeholder="••••" inputmode="numeric">
    <button onclick="tryUnlock()">解鎖</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCiGI6QP4gX8NDFSnVVJI5zkOfhw7ElCrg",
    authDomain: "quizcontest-63a85.firebaseapp.com",
    databaseURL: "https://quizcontest-63a85-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quizcontest-63a85",
    storageBucket: "quizcontest-63a85.firebasestorage.app",
    messagingSenderId: "575089833847",
    appId: "1:575089833847:web:b4c12dec9c3658e0049372"
  };

  const HOST_PASSWORD = "1234"; // 想改就改呢度

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const scoreRef = db.ref("scores");

  const HOUSES = [
    { key:"ruby",     name:"Ruby",     zh:"紅社" },
    { key:"topaz",    name:"Topaz",    zh:"黃社" },
    { key:"sapphire", name:"Sapphire", zh:"藍社" },
    { key:"emerald",  name:"Emerald",  zh:"綠社" },
  ];
  const HOUSE_MAP = Object.fromEntries(HOUSES.map(h => [h.key, h]));

  let scores = { ruby:0, topaz:0, sapphire:0, emerald:0 };
  let amount = 10;
  let isHost = false;

  const hash = location.hash.replace("#","").toLowerCase();
  const singleKey = HOUSE_MAP[hash] ? hash : null;
  if (hash === "host") isHost = true;

  const grid = document.getElementById("grid");
  HOUSES.forEach(h => {
    const card = document.createElement("div");
    card.className = "card " + h.key;
    card.id = "card-" + h.key;
    card.innerHTML = `
      <div class="crown">👑</div>
      <div><div class="cname">${h.name}</div><div class="czh">${h.zh}</div></div>
      <div class="score" id="score-${h.key}">0</div>
      <div class="btns">
        <button class="btn" onclick="change('${h.key}',-1)">−</button>
        <button class="btn" onclick="change('${h.key}',1)">＋</button>
      </div>`;
    grid.appendChild(card);
  });

  if (singleKey) {
    document.body.classList.add("single");
    const s = document.getElementById("single");
    const h = HOUSE_MAP[singleKey];
    s.classList.add(singleKey);
    document.getElementById("sName").textContent = h.name;
    document.getElementById("sZh").textContent = h.zh;
  } else {
    updateHostChrome();
  }

  document.querySelectorAll(".amt").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(".amt").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      amount = Number(b.dataset.v);
      document.getElementById("customAmt").value = "";
    };
  });
  document.getElementById("customAmt").oninput = (e) => {
    document.querySelectorAll(".amt").forEach(x => x.classList.remove("active"));
    amount = Number(e.target.value) || 0;
  };

  function updateHostChrome() {
    const btn = document.getElementById("modeBtn");
    btn.textContent = isHost ? "🔓 主持模式" : "🔒 顯示模式";
    btn.classList.toggle("on", isHost);
    document.getElementById("toolbar").style.display = isHost ? "flex" : "none";
    document.querySelectorAll(".btns").forEach(b => b.style.display = isHost ? "flex" : "none");
  }

  function toggleMode() {
    if (isHost) { isHost = false; updateHostChrome(); }
    else { document.getElementById("modal").classList.add("show"); document.getElementById("pw").focus(); }
  }
  function tryUnlock() {
    const inp = document.getElementById("pw");
    if (inp.value === HOST_PASSWORD) {
      isHost = true; updateHostChrome();
      document.getElementById("modal").classList.remove("show");
      inp.value=""; inp.classList.remove("err");
    } else { inp.classList.add("err"); inp.value=""; }
  }
  document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") tryUnlock(); });

  function change(key, dir) { if (!isHost) return; scoreRef.child(key).set((scores[key]||0) + dir*amount); }
  function resetAll() { if (!isHost) return; scoreRef.set({ ruby:0, topaz:0, sapphire:0, emerald:0 }); }

  scoreRef.on("value", snap => {
    const data = snap.val() || {};
    scores = { ruby:0, topaz:0, sapphire:0, emerald:0, ...data };
    const max = Math.max(...HOUSES.map(h => scores[h.key]));
    const any = HOUSES.some(h => scores[h.key] !== 0);

    if (singleKey) {
      const el = document.getElementById("sScore");
      if (el.textContent !== String(scores[singleKey])) {
        el.textContent = scores[singleKey];
        el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      }
      document.getElementById("sCrown").textContent = (any && scores[singleKey] === max) ? "👑" : "";
    } else {
      HOUSES.forEach(h => {
        const el = document.getElementById("score-"+h.key);
        const card = document.getElementById("card-"+h.key);
        if (el.textContent !== String(scores[h.key])) {
          el.textContent = scores[h.key];
          el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
        }
        card.classList.toggle("lead", any && scores[h.key] === max);
      });
    }
  });
</script>
</body>
</html>
